<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>بوابة كدانة — جرّب الوجوه الخمسة</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script><style>
body{margin:0;font-family:system-ui;background:#15171a;color:#fff;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}header img{height:26px}header span{font-size:14px;color:#9aa0a6}
model-viewer{flex:1;width:100%;background:linear-gradient(#232630,#3a3f4d)}
.bar{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:#101114}
button{border:1px solid #3a3f48;background:#1d2026;color:#fff;border-radius:20px;padding:8px 16px;font-family:inherit;font-size:13px;white-space:nowrap}
button.on{background:#00AEED;border-color:#00AEED;color:#04222e;font-weight:700}
.hint{position:fixed;top:64px;right:16px;background:#000a;border-radius:10px;padding:6px 12px;font-size:12px;color:#cfd3d8}</style></head><body>
<header><span>بوابة كدانة — جرّب الوجوه الخمسة</span><img src="kinda_white.png"></header>
<model-viewer id="mv" src="gate.glb" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="8deg" exposure="1.1" shadow-intensity="0.6" interaction-prompt="none" camera-orbit="-20deg 80deg auto"></model-viewer>
<div class="hint">اسحب للتحريك · قرّب بأصبعين</div><div class="bar"><button data-t="ramadan" data-c="#3a3c42">رمضان والإفطار</button><button data-t="founding" data-c="#9a6a45">يوم التأسيس</button><button data-t="national" data-c="#3f6e3a">اليوم الوطني</button><button data-t="green" data-c="#4f7d3c">المشاعر الخضراء</button><button data-t="well" data-c="#4f86a3">بئر كدانة</button></div>
<script>
const mv=document.getElementById('mv');

mv.addEventListener('load',()=>{
  const tyM=mv.model.materials.find(m=>m.name.startsWith('ty'));
  const rugM=mv.model.materials.find(m=>m.name.startsWith('rugm'));
  document.querySelectorAll('.bar button').forEach((b,i)=>{
    if(i==0)b.classList.add('on');
    b.onclick=async()=>{
      document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
      const tex=await mv.createTexture('tex/ty_'+b.dataset.t+'.png');
      if(tyM){tyM.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
        if(tyM.emissiveTexture)tyM.emissiveTexture.setTexture(tex);}
      if(rugM){const c=b.dataset.c;const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,bl=parseInt(c.slice(5,7),16)/255;
        rugM.pbrMetallicRoughness.setBaseColorFactor([r*r,g*g,bl*bl,1]);}
    };
  });
});
</script></body></html>
